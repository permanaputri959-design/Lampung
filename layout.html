<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Website - Provinsi Lampung</title>
    <style>
        /* --- Pengaturan Dasar --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        /* --- Bagian Header --- */
        header {
            background-color: #00897b;
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 48px;
            font-weight: 600;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
            opacity: 0.9;
            font-weight: 300;
        }

        /* --- Bagian Navigasi (Rata Kiri) --- */
        nav {
            background-color: #00897b;
            padding: 15px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        nav ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
            display: flex;
            justify-content: flex-start;
            gap: 30px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
            padding-bottom: 5px;
            transition: border-bottom 0.3s ease;
        }

        nav ul li a:hover {
            border-bottom: 2px solid #ffffff;
        }

        /* --- Bagian Kontainer Utama --- */
        main {
            display: flex;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            gap: 40px;
        }

        #content {
            flex: 3;
        }

        article h2 {
            color: #00897b;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 400;
        }

        #content p {
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
            margin-bottom: 25px;
            text-align: justify;
        }

        aside {
            flex: 1;
        }

        aside article {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
        }

        aside h3 {
            color: #00897b;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 500;
        }

        aside p {
            font-size: 14px;
            margin-bottom: 15px;
            color: #666666;
        }

        /* --- Bagian Footer --- */
        footer {
            background-color: #f1f1f1;
            color: #666666;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #ddd;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Judul Halaman</h1>
        <p>Keterangan singkat mengenai halaman ini.</p>
    </header>

    <!-- Navigasi -->
    <nav>
        <ul>
            <li><a href="index.html">Sejarah</a></li>
            <li><a href="layout.html">Geografis</a></li>
            <li><a href="#">Wisata</a></li>
        </ul>
    </nav>

    <!-- Konten Utama -->
    <main>
        <div id="content">
            <article>
                <h2>Judul Artikel</h2>
                <p>
                    Tulis isi konten atau artikel utama di sini...
                </p>
            </article>
        </div>

        <aside>
            <article>
                <h3>Sidebar</h3>
                <p>Informasi tambahan atau widget di sebelah kanan.</p>
            </article>
        </aside>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Profil Daerah</p>
    </footer>

</body>
</html>
